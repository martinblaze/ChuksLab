<!doctype html>
<html lang="en-NG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact &amp; Directions | CHUKS Medical Laboratory Center, Onitsha</title>
<meta name="description" content="Contact CHUKS Medical Laboratory Center in Inland Town, Onitsha. Get directions or send us a message.">
<link rel="canonical" href="https://chukslab.example/contact.html">
<meta name="theme-color" content="#0D2A1F">
<script>(function(){var h=document.documentElement;h.classList.add('js');})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..600,0..100&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact">
<main id="main">
  <section class="phero" data-bg="light">
    <div class="sky"></div><div class="cl cl--back" aria-hidden="true"></div><div class="cl cl--mid" aria-hidden="true"></div>
    <div class="phero__in">
      <p class="eyebrow" data-in>Contact &amp; directions</p>
      <h1 class="display">Find your way to <em>Chuks</em></h1>
      <p class="lead" data-in style="color:var(--forest-2)">CHUKS Medical Laboratory Center<br><span data-loc></span></p>
    </div>
  </section>

  <section class="sec" data-bg="light">
    <div class="split">
      <dl class="facts" data-fill="facts" style="margin:0"></dl>
      <div class="mapbox" data-fill="map" data-r></div>
    </div>
  </section>

  <section class="sec sec--cream" data-bg="light">
    <div class="split split--l">
      <div class="stack-t"><p class="eyebrow" data-r>Send a message</p><h2 class="h2" data-r>Ask us <em>anything.</em></h2><p class="lead" data-r>Tell us what you need and we’ll point you in the right direction. Please don’t include sensitive medical details in a message.</p><div class="split-photo" data-r><div class="ph" data-img-reveal data-parallax><img data-img="scientist"></div></div></div>
      <form id="contactForm" novalidate data-r>
        <div class="field"><label for="f-name">Your name</label><input id="f-name" name="name" autocomplete="name" required></div>
        <div class="field"><label for="f-phone">Phone (optional)</label><input id="f-phone" name="phone" type="tel" autocomplete="tel"></div>
        <div class="field"><label for="f-msg">Message</label><textarea id="f-msg" name="message" required></textarea></div>
        <button class="btn magnetic" type="submit"><span>Send message</span><span class="btn__i"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></button>
        <p class="form__status" id="formStatus" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>
</main>
<div id="ftr"></div>
<script src="js/data.js"></script>
<script src="lib/generators/art.js"></script><script src="lib/generators/clouds.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script><script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script><script src="https://unpkg.com/lenis@1.3.21/dist/lenis.min.js"></script>
<script src="lib/core/core.js"></script>
<script src="lib/fx/smooth-scroll.js"></script><script src="lib/fx/header.js"></script><script src="lib/fx/interaction.js"></script><script src="lib/fx/preloader-and-wipe.js"></script><script src="lib/fx/sky-clouds-dive.js"></script><script src="lib/fx/scroll-sections.js"></script><script src="lib/fx/inner-hero.js"></script><script src="lib/fx/photos.js"></script>
<script src="js/main.js"></script>
</body>
</html>
